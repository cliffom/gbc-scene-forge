name: Package checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python: ['3.10', '3.12', '3.14']
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
      - run: make setup
      - run: make lint test build
