name: Package checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python: ['3.10', '3.12', '3.14']
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install Poetry
        run: python -m pip install poetry==2.4.2
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: make setup
      - run: make lint test build
      - name: Installed-wheel smoke test
        run: |
          python -m venv "$RUNNER_TEMP/package-smoke"
          "$RUNNER_TEMP/package-smoke/bin/python" -m pip install --no-index --no-deps dist/*.whl
          "$RUNNER_TEMP/package-smoke/bin/python" -I tests/package_smoke.py
      - name: Browser acceptance checks
        if: matrix.python == '3.12'
        run: |
          .venv/bin/python tests/serve_fixture.py --root "$RUNNER_TEMP/forge-fixture" --port 8777 &
          fixture_pid=$!
          trap 'kill "$fixture_pid"' EXIT
          npm run test:browser -- http://127.0.0.1:8777/ /usr/bin/google-chrome
          npm run test:standalone -- /usr/bin/google-chrome
