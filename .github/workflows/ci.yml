name: Package checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-24.04
    env:
      FORGE_BUILD_MODE: production
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version-file: '.python-version'
      - name: Install Poetry
        run: python -m pip install poetry==2.4.2
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - run: make setup
      - run: make lint test-frontend build check-dist
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser acceptance checks
        run: make test-browser CHROME=/usr/bin/google-chrome
      - name: Installed-wheel first-use acceptance
        run: FORGE_TEST_PYTHON="$PWD/build/package-smoke/bin/python" npx playwright test --config tests/playwright.config.ts first-use.spec.ts
      - name: Optional MCP installed-wheel and browser checks
        run: |
          python -m venv build/mcp-ci
          for forge_wheel in dist/*.whl; do
            build/mcp-ci/bin/python -m pip install "${forge_wheel}[mcp]"
          done
          FORGE_MCP_PYTHON="$PWD/build/mcp-ci/bin/python" make test-mcp test-mcp-browser CHROME=/usr/bin/google-chrome
      - uses: actions/upload-artifact@v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: browser-diagnostics
          path: build/reports/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: compatibility-wheel
          path: dist/*.whl
          if-no-files-found: error
  python-compatibility:
    needs: checks
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@v8.0.2
        with:
          name: compatibility-wheel
          path: dist/
      - name: Install built wheel
        run: python -m pip install --no-index --no-deps dist/*.whl
      - name: Python tests
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Installed-wheel smoke test
        run: python -I tests/package_smoke.py
      - name: Optional MCP protocol compatibility
        run: |
          python -m pip install 'mcp>=1.30,<2'
          python -m unittest discover -s tests -p test_mcp.py
