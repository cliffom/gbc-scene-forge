name: Publish package
on:
  workflow_dispatch:
    inputs:
      index:
        description: Package index
        type: choice
        options: [testpypi, pypi]
        default: testpypi
permissions:
  contents: read
jobs:
  build:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version-file: '.python-version'
      - name: Install Poetry
        run: python -m pip install poetry==2.4.2
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - run: make setup
      - name: Check release tag matches package version
        run: |
          poetry run python -c 'import os, gbc_scene_forge; assert os.environ["GITHUB_REF_NAME"] == "v" + gbc_scene_forge.__version__'
      - run: make lint test build
      - name: Installed-wheel smoke test
        run: |
          python -m venv "$RUNNER_TEMP/package-smoke"
          "$RUNNER_TEMP/package-smoke/bin/python" -m pip install --no-index --no-deps dist/*.whl
          "$RUNNER_TEMP/package-smoke/bin/python" -I tests/package_smoke.py
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: distributions
          path: dist/
          if-no-files-found: error
  publish:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: ${{ inputs.index }}
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          name: distributions
          path: dist/
      - name: Publish to TestPyPI
        if: inputs.index == 'testpypi'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
      - name: Publish to PyPI
        if: inputs.index == 'pypi'
        uses: pypa/gh-action-pypi-publish@release/v1
