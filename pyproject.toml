[project]
name = "gbc-scene-forge"
version = "0.3.2"
description = "Standalone local scene editor for imported artwork and portable Tiled projects"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
keywords = ["game-boy-color", "scene-editor", "tilemap"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Games/Entertainment",
]

[project.urls]
Repository = "https://github.com/cliffom/gbc-scene-forge"
Documentation = "https://github.com/cliffom/gbc-scene-forge/blob/main/README.md"
Issues = "https://github.com/cliffom/gbc-scene-forge/issues"

[project.scripts]
gbc-scene-forge = "gbc_scene_forge.__main__:main"

[tool.poetry]
requires-poetry = ">=2.4,<3.0"
packages = [{ include = "gbc_scene_forge", from = "src" }]

[tool.hatch.build.targets.wheel]
packages = ["src/gbc_scene_forge"]
core-metadata-version = "2.4"

[tool.hatch.build.targets.wheel.force-include]
"assets/demo/project" = "gbc_scene_forge/demo_project"
"src/gbc_scene_forge/static/app.js" = "gbc_scene_forge/static/app.js"
"src/gbc_scene_forge/static/app.js.map" = "gbc_scene_forge/static/app.js.map"
"src/gbc_scene_forge/static/project.js" = "gbc_scene_forge/static/project.js"
"src/gbc_scene_forge/static/project.js.map" = "gbc_scene_forge/static/project.js.map"

[tool.hatch.build.targets.sdist]
core-metadata-version = "2.4"
include = [
    "/src", "/frontend", "/tests", "/docs", "/assets", "/Makefile", "/README.md",
    "/LICENSE", "/pyproject.toml", "/poetry.lock", "/package.json", "/package-lock.json",
    "/tsconfig.json", "/eslint.config.mjs", "/.prettierrc.json", "/.gitignore",
]

[tool.hatch.build.targets.sdist.force-include]
"src/gbc_scene_forge/static/app.js" = "src/gbc_scene_forge/static/app.js"
"src/gbc_scene_forge/static/app.js.map" = "src/gbc_scene_forge/static/app.js.map"
"src/gbc_scene_forge/static/app.meta.json" = "src/gbc_scene_forge/static/app.meta.json"
"src/gbc_scene_forge/static/project.js" = "src/gbc_scene_forge/static/project.js"
"src/gbc_scene_forge/static/project.js.map" = "src/gbc_scene_forge/static/project.js.map"

[tool.poetry.group.dev.dependencies]
ruff = "0.15.13"
build = ">=1.2,<2"
twine = ">=6,<7"

[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = ["build", ".tools", "dist", "node_modules"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"
