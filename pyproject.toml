[project]
name = "gbc-scene-forge"
version = "0.1.0"
description = "Local browser scene editor with game-owned connectors"
readme = "README.md"
requires-python = ">=3.10"
keywords = ["game-boy-color", "scene-editor", "tilemap"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Games/Entertainment",
]

[project.urls]
Repository = "https://github.com/cliffom/gbc-scene-forge"
Documentation = "https://github.com/cliffom/gbc-scene-forge/blob/main/README.md"
Issues = "https://github.com/cliffom/gbc-scene-forge/issues"

[tool.poetry]
requires-poetry = ">=2.4,<3.0"
packages = [{ include = "gbc_scene_forge", from = "src" }]
include = [
    { path = "src/gbc_scene_forge/static/*", format = ["sdist", "wheel"] },
    { path = "tests", format = "sdist" },
    { path = "docs", format = "sdist" },
    { path = "tools", format = "sdist" },
    { path = "Makefile", format = "sdist" },
    { path = "poetry.lock", format = "sdist" },
]

[tool.poetry.group.dev.dependencies]
ruff = "0.15.13"
build = ">=1.2,<2"
twine = ">=6,<7"

[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = ["build", ".tools", "dist"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[build-system]
requires = ["poetry-core>=2.0,<3.0"]
build-backend = "poetry.core.masonry.api"
